name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        if: ${{ hashFiles('api/*.sln', 'api/*.slnx') != '' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x   # match your SDK; check with `dotnet --version`
      - name: Restore
        if: ${{ hashFiles('api/*.sln', 'api/*.slnx') != '' }}
        run: dotnet restore
      - name: Build
        if: ${{ hashFiles('api/*.sln', 'api/*.slnx') != '' }}
        run: dotnet build --no-restore -c Release
      - name: Test
        if: ${{ hashFiles('api/*.sln', 'api/*.slnx') != '' }}
        run: dotnet test --no-build -c Release

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm ci
      - name: Lint
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm run lint
      - name: Build
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm run build

  # Added in later steps:
  #   - image build + Trivy scan (Step 4/6)
  #   - terraform fmt/validate, helm lint + kubeconform (Step 6)
  #   - deploy to dev with helm --atomic + smoke test (Step 6)
